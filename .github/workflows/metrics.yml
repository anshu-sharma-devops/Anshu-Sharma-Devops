name: Metrics

on:
  schedule:
    # Runs every 6 hours. Adjust as you like (cron is UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT stored as a repo secret (see setup notes below) — needs
          # "repo" and "read:user" scopes for full stats/language data.
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshu-sharma-devops
          template: classic
          base: "header, activity, community, repositories, metadata"

          # Commit the generated SVG to a dedicated "output" branch
          # so it never clutters your main branch history.
          committer_branch: output
          committer_message: "chore: update metrics.svg [skip ci]"

          # --- Top languages card ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8

          # --- Contribution habits / activity chart ---
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: compact

          # --- Misc ---
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
