name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: anshu-sharma-devops
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: output
          filename: github-metrics.svg
          extras_css: |
            body, .card, .octicon { background-color: #0D1117 !important; }
            body { color: #C9D1D9 !important; }
            h2, h3, .repo-star-icon, .field-value { color: #F7971E !important; }
            a { color: #F7971E !important; }
            .field { color: #C9D1D9 !important; }
            hr, .border { border-color: #F7971E !important; }
